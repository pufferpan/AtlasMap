name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: 编译场景状态助手
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish tools\scene_state\scene-state.csproj -c Release -o scripts\tools\scene-state
          if ($LASTEXITCODE -ne 0) { throw 'scene-state build failed' }
          foreach ($codec in @('Detex.dll', 'zlib-ng2.dll', 'oodle-data-shared.dll')) {
            Copy-Item -LiteralPath (Join-Path 'runtime' $codec) -Destination 'scripts\tools\scene-state' -Force
          }

      - name: 打包（目录版）
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = 'Continue'
          $env:ATLASMAP_TOOL_SOURCE = (Resolve-Path 'runtime').Path
          python -m PyInstaller --noconfirm AtlasMap.spec *> build.log
          $code = $LASTEXITCODE
          Get-Content build.log -Tail 60
          Get-Content build.log -Tail 2000 | Set-Content -Encoding utf8 'ci-build.log'
          if ($code -ne 0) {
            git config user.name 'ci'
            git config user.email 'ci@local'
            git checkout -B ci-build-log
            git add -f ci-build.log
            git commit -m 'CI 构建日志'
            git push -f origin ci-build-log
            throw "PyInstaller failed: $code"
          }
          if (-not (Test-Path 'dist\AtlasMap\AtlasMap.exe')) { throw 'AtlasMap.exe missing' }
          Compress-Archive -Path 'dist\AtlasMap\*' -DestinationPath 'AtlasMap-win64.zip' -Force
          $hash = (Get-FileHash 'AtlasMap-win64.zip' -Algorithm SHA256).Hash.ToLower()
          "$hash  AtlasMap-win64.zip" | Out-File -Encoding ascii 'AtlasMap-win64.zip.sha256'

      - name: 打包（单文件）
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = 'Continue'
          $env:ATLASMAP_TOOL_SOURCE = (Resolve-Path 'runtime').Path
          $env:ATLASMAP_BUILD_ONEFILE = '1'
          python -m PyInstaller --noconfirm --distpath dist-onefile --workpath build-onefile AtlasMap.spec *> build-onefile.log
          $code = $LASTEXITCODE
          Get-Content build-onefile.log -Tail 40
          if ($code -ne 0) { throw "PyInstaller (onefile) failed: $code" }
          if (-not (Test-Path 'dist-onefile\AtlasMap-Standalone.exe')) { throw 'AtlasMap-Standalone.exe missing' }
          Copy-Item 'dist-onefile\AtlasMap-Standalone.exe' 'AtlasMap-Standalone.exe' -Force
          $hash = (Get-FileHash 'AtlasMap-Standalone.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  AtlasMap-Standalone.exe" | Out-File -Encoding ascii 'AtlasMap-Standalone.exe.sha256'

      - uses: actions/upload-artifact@v4
        with:
          name: AtlasMap-win64
          path: |
            AtlasMap-win64.zip
            AtlasMap-win64.zip.sha256
            AtlasMap-Standalone.exe
            AtlasMap-Standalone.exe.sha256

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AtlasMap-win64.zip
            AtlasMap-win64.zip.sha256
            AtlasMap-Standalone.exe
            AtlasMap-Standalone.exe.sha256
